<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101318"><meta name="description" content="One phone. A room full of suspects. A private, pass-and-play Mafia game."><title>Mafia / After Dark</title><style>
:root{color-scheme:dark;--bg:#101318;--panel:#1a2028;--line:#303946;--ink:#f0eee8;--muted:#a5adb8;--acid:#c8f97b;--red:#ff8b85}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acid);outline-offset:3px}button,.btn{min-height:48px;border:1px solid var(--line);border-radius:9px;padding:12px 16px;background:var(--panel);color:var(--ink);text-align:center;font-weight:650}button:hover{border-color:var(--acid)}button.primary{background:var(--acid);color:#16200c;border-color:var(--acid)}button.quiet{background:transparent}button.danger{color:var(--red)}button.selected{border-color:var(--acid);background:#293b24;color:var(--acid)}input,textarea,select{width:100%;color:var(--ink);background:#12171d;border:1px solid var(--line);border-radius:8px;padding:12px}textarea{resize:vertical;min-height:166px}label{display:block;margin:18px 0 7px;color:var(--muted);font-size:14px}.shell{max-width:620px;margin:auto;padding:24px 22px calc(30px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:30px}.wordmark{font:900 18px monospace;letter-spacing:.12em}.dot{color:var(--acid)}.tag,.eyebrow{font:12px/1.6 monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.eyebrow{color:var(--acid)}h1{font-size:clamp(36px,10vw,58px);line-height:1.03;letter-spacing:-.055em;margin:16px 0 18px}h2{font-size:28px;line-height:1.15;letter-spacing:-.035em;margin:12px 0 16px}h3{font-size:18px;margin:0 0 10px}p{margin:12px 0;color:var(--muted)}strong{color:var(--ink)}.lead{font-size:18px;max-width:440px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:22px 0}.secret{min-height:240px;display:flex;flex-direction:column;justify-content:center;text-align:center;border-color:var(--acid)}.secret h1{font-size:46px;color:var(--acid)}.stack{display:grid;gap:10px;margin-top:22px}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid button{overflow-wrap:anywhere}.small{font-size:13px;color:var(--muted)}.line{border-top:1px solid var(--line);margin-top:26px;padding-top:18px}.error{color:var(--red)}.pill{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:3px 8px;font:12px monospace;margin:3px 4px 3px 0}.alive{color:var(--acid)}.dead{color:var(--muted)}.roster{list-style:none;padding:0}.roster li{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:12px 0;overflow-wrap:anywhere}.roster li span:first-child{min-width:0}.timer{font:64px/1.2 monospace;letter-spacing:-.06em;font-variant-numeric:tabular-nums;color:var(--acid)}.city{height:74px;display:flex;gap:7px;align-items:end;margin:30px 0 22px;opacity:.65}.city i{display:block;background:repeating-linear-gradient(0deg,transparent 0 9px,#101318 9px 14px),repeating-linear-gradient(90deg,#638044 0 7px,#1a2028 7px 14px);width:14%;height:70%}.city i:nth-child(2n){height:100%}.city i:nth-child(3n){height:48%}.progress{height:3px;background:var(--line);margin:0 0 26px}.progress span{height:100%;display:block;background:var(--acid)}details{margin:18px 0}summary{cursor:pointer;min-height:44px;padding:10px 0}ul{padding-left:22px}li{margin:7px 0}.notice{border-left:3px solid var(--acid);padding:0 0 0 14px}.history{font-size:14px}.footer{padding-top:24px;font:11px monospace;letter-spacing:.06em;color:var(--muted)}@media(min-width:700px){.shell{padding-top:38px}header{padding-bottom:44px}}@media(prefers-reduced-motion:no-preference){main{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform </style></head><body><div class="shell"><header><span class="wordmark">M<span class="dot">/</span>AFIA</span><span class="tag">After dark</span></header><main id="app"></main><footer class="footer">ONE PHONE. NO ACCOUNTS. TRUST NO ONE.</footer></div>
<script id="engine">
const Rules={
 roles(n,m,doctor=true,detective=true,cutie=false){if(n<5||n>20||m<1||m*2>=n||m+(doctor?1:0)+(detective?1:0)+(cutie?1:0)>n)throw Error('Invalid line-up');return [...Array(m).fill('Mafia'),...(doctor?['Doctor']:[]),...(detective?['Detective']:[]),...(cutie?['Cutie']:[]),...Array(n-m-(doctor?1:0)-(detective?1:0)-(cutie?1:0)).fill('Town')];},
 winner(ps){const a=ps.filter(p=>p.alive),m=a.filter(p=>p.role==='Mafia').length;return m===0?'Town':m>=a.length-m?'Mafia':null;},
 tally(votes,allowed){const c={};for(const v of votes)if(allowed.includes(v))c[v]=(c[v]||0)+1;const top=Math.max(0,...Object.values(c));return {counts:c,tied:top?Object.keys(c).filter(k=>c[k]===top):[],top};},
 night(ps,actions,choose){const mafia=ps.filter(p=>p.alive&&p.role==='Mafia').map(p=>actions[p.id]).filter(id=>ps.some(p=>p.id===id&&p.alive&&p.role!=='Mafia'));const t=this.tally(mafia,ps.filter(p=>p.alive&&p.role!=='Mafia').map(p=>p.id));const target=t.tied.length?choose(t.tied):null;const saved=ps.some(p=>p.alive&&p.role==='Doctor'&&actions[p.id]===target);return {target,saved,killed:target&&!saved?target:null};},
 mute(ps,actions){const c=ps.find(p=>p.alive&&p.role==='Cutie'),id=c&&actions[c.id];return ps.some(p=>p.alive&&p.id===id&&p.id!==c?.id)?id:null;},
 voters(ps,muted){return ps.filter(p=>p.alive&&p.id!==muted).map(p=>p.id);},
 vote(votes,allowed){const t=this.tally(votes,[...allowed,'skip']);return {...t,eliminated:t.tied.length===1&&t.tied[0]!=='skip'?t.tied[0]:null,runoff:t.tied.length>1?t.tied:[]};}
};
if(typeof module!=='undefined')module.exports=Rules;
</script><script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app'), KEY='mafia-after-dark-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rand(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let game=null,screen='setup',revealed=false,selection=null,inspectResult=false,pending=false,timer=null,endAt=null,left=180,timerRunning=false;
try{game=JSON.parse(localStorage.getItem(KEY));if(game&&game.version===1)screen='resume';else game=null}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch{storageWarning=true}}let storageWarning=false;
function remove(){try{localStorage.removeItem(KEY)}catch{}}function alive(){return game.players.filter(p=>p.alive)}function person(id){return game.players.find(p=>p.id===id)}function pname(id){return id==='skip'?'No elimination':person(id)?.name||'No one'}
function head(k,t,p=''){return `<div class="eyebrow">${esc(k)}</div><h1>${esc(t)}</h1>${p?`<p class="lead">${esc(p)}</p>`:''}`}
function button(t,act,cls=''){return `<button class="${cls}" data-act="${act}">${t}</button>`}function buttons(s){return `<div class="stack">${s}</div>`}function progress(i,n){return `<div class="progress"><span style="width:${100*i/n}%"></span></div>`}
const descriptions={Cutie:'You are Town. Each night, choose one other living player. They must stay silent and cannot vote during the following day, including any runoff. Their night power still works.',Mafia:'Work with your fellow Mafia. Choose a Town player each night. Win when Mafia equal or outnumber everyone else.',Doctor:'You are Town. Protect one living player each night, including yourself. The same player may be protected on consecutive nights.',Detective:'You are Town. Check one other living player each night. Only you see whether they are Mafia.',Town:'Find the Mafia through discussion and voting. Your night selection is a decoy and has no game effect.'};
function rules(){return `<h2>The house rules</h2><p>5-20 players, one phone, no moderator. Sit in a circle and keep your screen private. This is an in-person game, not an online room.</p><ul><li>Pass the phone in the displayed order. Only the named player opens it.</li><li>Every living player takes a private night turn. Town choose a decoy suspicion, so everyone interacts with the phone. Keep turns roughly equal; timing can still give clues.</li><li>Mafia see their teammates. They vote for a non-Mafia target. Most votes wins; a tied night target is chosen at random.</li><li>The Doctor can protect anyone alive, including themself, on consecutive nights. Protection and the kill resolve together after every turn.</li><li>The Detective checks one other living player and privately sees Mafia / not Mafia. There is no Godfather or misleading result.</li><li>Cutie is Town. Each night they point to one other living player, who is muted for the following day and cannot vote, including in a runoff. They may still be voted out and use their night power. The mute expires next night; the same target may be picked again. An elimination that night does not undo Cutie’s choice.</li><li>Discuss out loud for as long as you like, then every living player votes privately. No self-votes. A unique top vote eliminates, unless "No elimination" wins. A tie gets one runoff; another tie means no elimination.</li><li>Eliminated roles are public. Dead players stay silent and cannot vote or act.</li><li>Town wins when all Mafia are gone. Mafia wins at equal or greater numbers than Town, including special roles.</li></ul><p class="small">No screenshots or peeking. A browser cannot stop someone inspecting local game data. Progress is saved only in this browser on this device; clearing site data loses it. The screen locks when you leave the tab.</p><p class="small">Rules reference: <a href="https://www.houseofmafia.com/en/rules" target="_blank" rel="noopener" style="color:var(--acid)">House of Mafia</a>. Tie and protection rules above are this app's stated house variant.</p>`}
function roster(show=false){return `<ul class="roster">${game.players.map(p=>`<li><span>${esc(p.name)} ${!p.alive?'<span class="pill">Out</span>':game.muted===p.id?'<span class="pill">Muted · no vote</span>':''}</span><span class="${p.alive?'alive':'dead'}">${show||!p.alive?esc(p.role):'In play'}</span></li>`).join('')}</ul>`}
function render(){clearInterval(timer);timer=null;app.innerHTML='';if(screen==='setup'){app.innerHTML=head('A game of trust & betrayal','The city sleeps.\nSomeone doesn’t.','Get your people together. Deal the secrets. Survive the night.')+`<div class="city" aria-hidden="true">${'<i></i>'.repeat(7)}</div><label for="names">Players · one name per line · 5-20</label><textarea id="names" placeholder="Ansh\nRohan\nPriya\nAman\nNeha\nKabir" maxlength="600"></textarea><div><label for="mafia">Mafia</label><select id="mafia"><option value="auto">Auto line-up</option>${[1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="row"><div><label for="doctor">Doctor</label><select id="doctor"><option value="yes">In</option><option value="no">Out</option></select></div><div><label for="detective">Detective</label><select id="detective"><option value="yes">In</option><option value="no">Out</option></select></div></div><label for="cutie">Cutie · mute + no vote</label><select id="cutie"><option value="yes" selected>In</option><option value="no">Out</option></select><p id="error" class="error" role="alert"></p>`+buttons(button('Deal the roles ↗','deal','primary'))+`<details><summary>How to play / privacy</summary>${rules()}</details>`;return}
 if(screen==='resume'){app.innerHTML=head('Game saved','Back after dark.','Resume behind the privacy screen. No roles are shown here.')+buttons(button('Resume game','resume','primary')+button('New game','reset','quiet'));return}
 if(screen==='locked'){app.innerHTML=head('Privacy lock','Keep it secret.','The game was hidden because you left the tab. Hand the phone to the player whose turn it is.')+buttons(button('Continue to handoff','unlock','primary'));return}
 if(screen==='confirmReset'){app.innerHTML=head('Start over?','End this game?','This clears all roles, votes and saved progress. It cannot be undone.')+buttons(button('Keep playing','cancelReset','primary')+button('End game & clear data','confirmReset','danger'));return}
 if(game.stage==='deal'){let p=game.players[game.turn];app.innerHTML=progress(game.turn,game.players.length)+head(`Role ${game.turn+1} / ${game.players.length}`,revealed?'Your secret.':`Pass to ${p.name}`,revealed?'Only you should see this.':'Everyone else, look away. Open only when the phone is yours.')+(revealed?`<div class="card secret"><span class="tag">${esc(p.name)}, you are</span><h1>${esc(p.role)}</h1><p>${descriptions[p.role]}</p>${p.role==='Mafia'?`<p><strong>Other Mafia:</strong> ${game.players.filter(q=>q.role==='Mafia'&&q.id!==p.id).map(q=>esc(q.name)).join(', ')||'You are the only one.'}</p>`:''}</div>`:'<div class="card secret"><span class="wordmark" style="font-size:58px;color:var(--line)">?</span><p>No peeking.</p></div>')+buttons(button(revealed?'Hide & pass the phone':'Reveal my role',revealed?'nextRole':'reveal',revealed?'':'primary'));return}
 if(game.stage==='nightIntro'){app.innerHTML=head(`Night ${game.round}`,'Lights out.','Sit in a circle. Keep the screen away from others. Every living player gets a private turn.')+`<div class="card"><h3>One phone. Quiet choices.</h3><p>Pass in the order shown. Mafia, Doctor, Detective and Cutie act in secret. Everyone else makes a decoy selection. No talking until morning.</p><p class="small">Keep every turn roughly the same length. This app does not speak roles aloud.</p></div>`+buttons(button('Begin night','beginNight','primary'))+publicTools();return}
 if(game.stage==='night'){const ids=game.order,p=person(ids[game.turn]);app.innerHTML=progress(game.turn,ids.length)+head(`Night ${game.round} · Turn ${game.turn+1} / ${ids.length}`,revealed?`Your turn, ${p.name}`:`Pass to ${p.name}`,revealed?'Keep the phone private.':'Everyone else, look away.')+(!revealed?`<div class="card secret"><span style="font-size:48px">☾</span><p>Only ${esc(p.name)} opens this.</p></div>`+buttons(button('Open my night turn','reveal','primary')):nightUI(p));return}
 if(game.stage==='morning'){app.innerHTML=head(`Day ${game.round}`,'Morning breaks.',game.announcement+' Discuss out loud for as long as you like, then start voting.')+muteNotice()+roster()+buttons(button('Start private voting','beginVote','primary'))+publicTools();return}
 if(game.stage==='discussion'){app.innerHTML=head(`Day ${game.round}`,'Ready to vote?','Discuss out loud for as long as you want. Then start private voting.')+muteNotice()+roster()+buttons(button('Start private voting','beginVote','primary'))+publicTools();return}
 if(game.stage==='vote'){const p=person(game.order[game.turn]);app.innerHTML=progress(game.turn,game.order.length)+head(`Day ${game.round} · ${game.runoff?'Runoff':'Vote'} ${game.turn+1} / ${game.order.length}`,revealed?`${p.name}, cast your vote`:`Pass to ${p.name}`,revealed?(game.runoff?'Vote only among the tied options. Another tie means no elimination.':'Choose one player to eliminate, or no elimination.'):'Only the named player should see the ballot.')+(!revealed?buttons(button('Open my ballot','reveal','primary')):choiceUI(game.candidates.filter(id=>id!==p.id),true));return}
 if(game.stage==='voteResult'){app.innerHTML=head(`Day ${game.round} · Vote result`,game.resultTitle,game.resultText)+`<div class="card">${game.tally.map(([id,n])=>`<div class="roster"><div class="row"><span>${esc(pname(id))}</span><strong style="text-align:right">${n}</strong></div></div>`).join('')}</div>`+buttons(button(game.next==='runoff'?'Begin runoff':'Next night',game.next==='runoff'?'runoff':'nextNight','primary'))+publicTools();return}
 if(game.stage==='over'){app.innerHTML=head('Case closed',`${game.winner} wins.`,game.winner==='Town'?'Every Mafia player has been found. The city can sleep.':'The Mafia now control the city.')+roster(true)+`<details open><summary>The story tonight</summary><ul class="history">${game.history.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`+buttons(button('Play again · same players','rematch','primary')+button('New players','reset','quiet'));return}
}
function muteNotice(){const p=person(game.muted);return p&&p.alive?`<div class="notice"><strong>${esc(p.name)} is muted today.</strong><p>No talking and no vote, including a runoff. Everyone else can still vote for them. The restriction ends next night.</p></div>`:''}
function publicTools(){return `<details><summary>Rules & game controls</summary>${rules()}${button('End game','reset','danger')}</details>${storageWarning?'<p class="error">Saving is unavailable. Keep this tab open to preserve the game.</p>':''}`}
function nightUI(p){if(inspectResult)return `<div class="card secret"><span class="tag">Private investigation</span><h2>${esc(pname(game.actions[p.id]))}</h2><p><strong>${person(game.actions[p.id]).role==='Mafia'?'Mafia':'Not Mafia'}</strong></p><p class="small">Remember this. Nobody else sees the result.</p></div>`+buttons(button('Hide & pass','finishNight','primary'));let targets=alive().filter(q=>p.role==='Mafia'?q.role!=='Mafia':['Detective','Cutie'].includes(p.role)?q.id!==p.id:true);return `<div class="card"><span class="pill">${esc(p.role)}</span><p>${p.role==='Mafia'?'Choose tonight’s target. Other Mafia: '+(game.players.filter(q=>q.role==='Mafia'&&q.id!==p.id).map(q=>esc(q.name)+(q.alive?'':' (out)')).join(', ')||'none'):p.role==='Doctor'?'Choose someone to protect tonight. You can protect yourself.':p.role==='Detective'?'Check one other player. Your result stays private.':p.role==='Cutie'?'Point to one other player. Tomorrow they must stay silent and cannot vote, including in a runoff. Their night power still works.':'Choose someone you suspect. This is a decoy and has no effect tonight.'}</p></div>`+choiceUI(targets.map(q=>q.id),false)}
function choiceUI(ids,vote){return `<div class="grid">${ids.map(id=>`<button data-choice="${id}" class="${selection===id?'selected':''}" aria-pressed="${selection===id}">${esc(pname(id))}</button>`).join('')}${vote&&!game.runoff?`<button data-choice="skip" class="${selection==='skip'?'selected':''}">No elimination</button>`:''}</div>`+buttons(`<button class="primary" data-act="${vote?'castVote':'actNight'}" ${selection===null?'disabled':''}>Confirm ${vote?'vote':'choice'} & ${!vote&&person(game.order[game.turn]).role==='Detective'?'check':'hide'}</button>`)}
function timeStr(){const s=timerRunning?Math.max(0,Math.ceil((endAt-Date.now())/1000)):left;return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function tick(){timer=setInterval(()=>{if($('#clock'))$('#clock').textContent=timeStr();if(Date.now()>=endAt){timerRunning=false;left=0;clearInterval(timer);if($('#timerText'))$('#timerText').textContent='Time is up. Finish the discussion or start voting.';const b=$('[data-act="timer"]');if(b)b.textContent='Start'}},250)}
function freshTurn(){revealed=false;selection=null;inspectResult=false;save();render()}
function checkWin(){const w=Rules.winner(game.players);if(w){game.stage='over';game.winner=w;save();return true}return false}
function startNight(){game.stage='nightIntro';game.muted=null;game.actions={};game.order=alive().map(p=>p.id);game.turn=0;freshTurn()}
function finishNight(){game.turn++;if(game.turn<game.order.length){freshTurn();return}game.muted=Rules.mute(game.players,game.actions);const n=Rules.night(game.players,game.actions,a=>a[rand(a.length)]);if(n.killed){person(n.killed).alive=false;game.announcement=`${pname(n.killed)} was eliminated. They were ${person(n.killed).role}.`}else game.announcement='Everyone survived the night.';game.history.push(`Night ${game.round}: ${game.announcement}${person(game.muted)?.alive?' '+pname(game.muted)+' is muted today and cannot vote.':''}`);game.stage='morning';checkWin();freshTurn()}
function beginVote(runoff=false){timerRunning=false;clearInterval(timer);game.stage='vote';game.runoff=runoff;game.votes={};game.turn=0;game.order=Rules.voters(game.players,game.muted);if(!runoff)game.candidates=alive().map(p=>p.id);freshTurn()}
function resolveVote(){const v=Rules.vote(Object.values(game.votes),game.candidates);game.tally=Object.entries(v.counts).sort((a,b)=>b[1]-a[1]);game.stage='voteResult';if(v.runoff.length&&!game.runoff){game.candidates=v.runoff;game.resultTitle='Too close to call.';game.resultText='The top choices tied. Everyone alive votes again between these options.';game.next='runoff';game.history.push(`Day ${game.round}: tied vote; runoff.`)}else{game.next='night';if(v.eliminated){const p=person(v.eliminated);p.alive=false;game.resultTitle=`${p.name} is out.`;game.resultText=`They were ${p.role}.`}else{game.resultTitle='Nobody is out.';game.resultText=v.runoff.length?'The runoff tied. The city moves on without an elimination.':'The town chose no elimination.'}game.history.push(`Day ${game.round}: ${game.resultTitle} ${game.resultText}`);checkWin()}freshTurn()}
function startGame(names,m,doctor,detective,duration,cutie=false){const roles=shuffle(Rules.roles(names.length,m,doctor,detective,cutie));game={version:1,players:names.map((name,i)=>({id:'p'+i,name,role:roles[i],alive:true})),stage:'deal',turn:0,round:1,duration,history:[],actions:{}};screen='game';freshTurn()}
let previousScreen='game';app.addEventListener('click',e=>{const c=e.target.closest('[data-choice]');if(c){selection=c.dataset.choice;render();return}const b=e.target.closest('[data-act]');if(!b||b.disabled||pending)return;pending=true;try{const act=b.dataset.act;
if(act==='deal'){const names=$('#names').value.split('\n').map(s=>s.trim()).filter(Boolean),m=$('#mafia').value==='auto'?Math.max(1,Math.floor(names.length/4)):Number($('#mafia').value);if(names.length<5||names.length>20)throw Error('Add between 5 and 20 players.');if(names.some(n=>n.length>24))throw Error('Keep each name to 24 characters or less.');if(new Set(names.map(n=>n.toLocaleLowerCase())).size!==names.length)throw Error('Use unique names, so every handoff is clear.');if(m*2>=names.length)throw Error('Mafia must be fewer than half the players.');startGame(names,m,$('#doctor').value==='yes',$('#detective').value==='yes',0,$('#cutie').value==='yes');}
else if(act==='reveal'){revealed=true;selection=null;if(game.stage==='night'){const p=person(game.order[game.turn]);inspectResult=p.role==='Detective'&&!!game.actions[p.id]}render()}
else if(act==='nextRole'){game.turn++;if(game.turn>=game.players.length)startNight();else freshTurn()}
else if(act==='beginNight'){game.stage='night';game.turn=0;freshTurn()}
else if(act==='actNight'){if(selection===null)return;const p=person(game.order[game.turn]);game.actions[p.id]=selection;selection=null;save();if(p.role==='Detective'){inspectResult=true;render()}else finishNight()}
else if(act==='finishNight')finishNight();
else if(act==='discuss'){game.stage='discussion';left=game.duration;timerRunning=false;save();render()}
else if(act==='timer'){if(timerRunning){left=Math.max(0,Math.ceil((endAt-Date.now())/1000));timerRunning=false}else{if(left===0)left=game.duration;endAt=Date.now()+left*1000;timerRunning=true}render()}
else if(act==='timerReset'){left=game.duration;timerRunning=false;render()}
else if(act==='beginVote')beginVote();
else if(act==='castVote'){if(selection===null)return;game.votes[game.order[game.turn]]=selection;game.turn++;if(game.turn>=game.order.length)resolveVote();else freshTurn()}
else if(act==='runoff')beginVote(true);
else if(act==='nextNight'){game.round++;startNight()}
else if(act==='resume'||act==='unlock'){screen='game';revealed=false;selection=null;inspectResult=false;if(game.stage==='discussion'){left=game.duration;timerRunning=false}render()}
else if(act==='reset'){previousScreen=screen;screen='confirmReset';render()}
else if(act==='cancelReset'){screen=previousScreen;render()}
else if(act==='confirmReset'){game=null;remove();screen='setup';timerRunning=false;render()}
else if(act==='rematch'){const old=game;startGame(old.players.map(p=>p.name),old.players.filter(p=>p.role==='Mafia').length,old.players.some(p=>p.role==='Doctor'),old.players.some(p=>p.role==='Detective'),old.duration,old.players.some(p=>p.role==='Cutie'))}
}catch(err){if($('#error'))$('#error').textContent=err.message;else console.error(err)}finally{pending=false}});
function lock(){if(game&&screen==='game'&&['deal','night','vote'].includes(game.stage)){revealed=false;selection=null;inspectResult=false;screen='locked';render()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});window.addEventListener('blur',lock);window.addEventListener('pagehide',lock);render();
</script></body></html>
